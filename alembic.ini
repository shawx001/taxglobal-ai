[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Overridden at runtime by alembic/env.py using backend.config.DATABASE_SYNC_URL.
# This placeholder avoids hard-coding real credentials in a tracked file.
sqlalchemy.url = postgresql://user:pass@localhost:5432/placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
