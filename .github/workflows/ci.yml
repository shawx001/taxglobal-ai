name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pip-audit -r backend/requirements.txt
      - name: Lint
        run: ruff check engine backend tests
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt
      - name: Unit + golden tests
        run: python -m unittest discover -s tests -v
      - name: Data layer validation
        shell: pwsh
        run: ./tests/validate_step1_data.ps1
